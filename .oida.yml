# Directory and file filters
included:
  - Plugins
  - Source
  - Tests
  - Package.swift
excluded:
  - Tests/BuiltInRulesTests/Resources
  - Tests/FileSystemAccessTests/Resources
  - Tests/IntegrationTests/Resources

# Enabled/disabled rules
analyzer_rules:
  - unused_declaration
  - unused_import
opt_in_rules:
  - all
disabled_rules:
  - multiline_call_arguments
  - todo
  # The house rules in Rules/House belong to the consumer, not to this codebase — most encode one app's
  # layering, navigation and storage boundaries, and `no_single_use_void_functions` reads a style the inherited
  # SwiftLint code was never written to. `opt_in_rules: all` above would otherwise enforce them here, and
  # the integration test that lints this project fails on what they find.
  # `grouped_imports` has to be among them for a second reason — it disagrees with `sorted_imports`, which
  # `all` also enables, and a file corrected by both ends up with its header comment moved below an import.
  - comment_adds_no_word
  - document_avoids_retired_words
  - document_links_resolve
  - document_says_what_is
  - environment_key_needs_judgement
  - environment_value_reassertion
  - grouped_imports
  - key_path_only_where_the_api_takes_one
  - keychain_built_only_at_the_root
  - multiline_conditions
  - multiline_string_opens_on_its_own_line
  - navigation_destination_only_in_navigation
  - no_direct_navigation_controller_calls
  - no_doc_comments
  - no_direct_presentation
  - no_legacy_router_readers
  - no_live_uikit_frame_reads
  - no_mark_comments
  - no_presentation_state_outside_navigation
  - no_print_in_app_code
  - no_share_link
  - no_single_use_void_functions
  - no_timing_guess
  - no_uiapplication_shared
  - no_user_defaults_in_app_code
  - tienda_api_kit_is_ui_free
  - value_storage_built_only_at_the_root

# Configurations
identifier_name:
  excluded:
    - id
unneeded_override:
  affect_initializers: true
unused_import:
  always_keep_imports:
    - SwiftSyntaxBuilder # we can't detect uses of string interpolation of swift syntax nodes
    - SwiftLintFramework # now that this is a wrapper around other modules, don't treat as unused

# Custom rules
custom_rules:
  rule_id:
    included: Source/SwiftLintBuiltInRules/Rules/.+/\w+\.swift
    name: Rule ID
    message: Rule IDs must be all lowercase, snake case and not end with `rule`
    regex: ^\s+identifier:\s*("\w+_rule"|"\S*[^a-z_]\S*")
    severity: error
  fatal_error:
    name: Fatal Error
    excluded: "Tests/*"
    message: Prefer `queuedFatalError` over `fatalError` to avoid leaking compiler host machine paths
    regex: \bfatalError\b
    match_kinds:
      - identifier
    severity: error
  rule_test_function:
    included: Tests/SwiftLintFrameworkTests/RulesTests.swift
    name: Rule Test Function
    message: Rule Test Function mustn't end with `rule`
    regex: func\s*test\w+(r|R)ule\(\)
    severity: error
  testable_import:
    included: Tests/TestHelpers/.+\.swift
    name: Testable Import
    message: Do not use @testable imports
    regex: ^\s*@testable\s+import\s+\w+
    severity: error
