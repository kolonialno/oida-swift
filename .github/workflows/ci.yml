name: CI

# Upstream's twelve workflows went with the fork's history and came out again here: Bazel matrices, Docker
# images, docs deploys, CocoaPods publishing, and a release job that fires on `release: published` and pushes
# commits back to main. None of it is ours to run, and one of them would have hijacked our first release.
# What is left is what we actually ship: a binary that builds, and rules whose tests pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The published binary is a macOS one, and some of what it does is macOS-only — `--format` finds
    # swift-format inside Xcode here and in the toolchain on Linux — so this build is the only place that
    # code compiles before a tag. The tests do not run here: they are rule tests, identical on both
    # platforms, and on this runner they deadlock in swiftpm-testing until the six-hour cap kills the job.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build
        run: swift build --product oida

  build-and-test-linux:
    # We also publish a Linux binary (for CI runners that don't have Xcode), and this is where the rules
    # are tested, since a rule behaves the same on either platform.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build
        run: swift build --product oida
      - name: Test the rules
        # Only these two suites. The rest of the suite is not runnable here: `IntegrationTests` corrects the
        # repository's own source in place, and the tests inherited for disable commands still assert the
        # column `swiftlint:` sat at, five characters right of `oida:`.
        run: swift test --filter "GeneratedTests|ResultReuseTests"
